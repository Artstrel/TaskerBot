services:
  - type: web
    name: taskerbot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_AI_PROVIDER
        value: groq
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        value: https://taskerbot-plp5.onrender.com
      - key: TELEGRAM_OIDC_CLIENT_ID
        sync: false
      - key: TELEGRAM_OIDC_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 8000
