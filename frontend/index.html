<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" id="meta-theme-color" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f6" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chihiro Tasker" />
    <title>Chihiro Tasker — Трекер задач, привычек и целей</title>
    <meta name="description" content="Персональный трекер задач, привычек и списков покупок с поддержкой Telegram WebApp" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chihiro Tasker — Трекер задач, привычек и целей" />
    <meta property="og:description" content="Персональный трекер задач, привычек и списков покупок с поддержкой Telegram WebApp" />
    <meta property="og:image" content="/brand-avatar.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chihiro Tasker — Трекер задач, привычек и целей" />
    <meta name="twitter:description" content="Персональный трекер задач, привычек и списков покупок с поддержкой Telegram WebApp" />
    <meta name="twitter:image" content="/brand-avatar.png" />
    <!-- Critical first-paint background & color-scheme: guarantees solid root canvas in safe-area zones before the CSS bundle loads -->
    <style>
      :root {
        color-scheme: dark;
      }
      :root[data-theme="light"],
      [data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"],
      [data-theme="dark"] {
        color-scheme: dark;
      }
      html, body, #root {
        background-color: #0d0d0d;
        color-scheme: dark;
        min-height: 100%;
        min-height: 100dvh;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root,
      [data-theme="light"],
      [data-theme="light"] body,
      [data-theme="light"] #root {
        background-color: #f4f4f6;
        color-scheme: light;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root,
      [data-theme="dark"],
      [data-theme="dark"] body,
      [data-theme="dark"] #root {
        background-color: #0d0d0d;
        color-scheme: dark;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (isIOS) {
            document.documentElement.classList.add('is-ios');
          }
          var mode = localStorage.getItem('tasker_theme_mode') || 'auto';
          var theme = 'dark';
          if (mode === 'light') {
            theme = 'light';
          } else if (mode === 'dark') {
            theme = 'dark';
          } else {
            var sched = localStorage.getItem('tasker_theme_schedule_enabled') === 'true';
            if (sched) {
              var start = localStorage.getItem('tasker_theme_schedule_start') || '07:00';
              var end = localStorage.getItem('tasker_theme_schedule_end') || '20:00';
              var d = new Date();
              var h = String(d.getHours()).padStart(2, '0');
              var m = String(d.getMinutes()).padStart(2, '0');
              var cur = h + ':' + m;
              var isDay = start <= end ? (cur >= start && cur < end) : (cur >= start || cur < end);
              theme = isDay ? 'light' : 'dark';
            } else {
              var tg = window.Telegram && window.Telegram.WebApp;
              var isTg = tg && ((tg.initData && tg.initData.length > 0) || (tg.initDataUnsafe && tg.initDataUnsafe.user) || (tg.platform && tg.platform !== 'unknown') || (window.location.hash && window.location.hash.indexOf('tgWebAppData')) !== -1);
              if (isTg && tg.colorScheme) {
                theme = tg.colorScheme === 'light' ? 'light' : 'dark';
              } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
              } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                theme = 'light';
              }
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var themeColor = theme === 'light' ? '#f4f4f6' : '#0d0d0d';
          document.documentElement.style.backgroundColor = themeColor;
          var metaColorScheme = document.querySelector('meta[name="color-scheme"]');
          if (metaColorScheme) {
            metaColorScheme.setAttribute('content', theme);
          }
          var metaThemes = document.querySelectorAll('meta[name="theme-color"]');
          if (metaThemes.length > 0) {
            metaThemes.forEach(function(m) {
              m.setAttribute('content', themeColor);
            });
          }
          var dynamicMeta = document.getElementById('meta-theme-color');
          if (dynamicMeta) {
            dynamicMeta.removeAttribute('media');
            dynamicMeta.setAttribute('content', themeColor);
          }
          var metaStatusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (metaStatusBar) {
            metaStatusBar.setAttribute('content', theme === 'light' ? 'default' : 'black-translucent');
          }
          if (document.body) {
            document.body.setAttribute('data-theme', theme);
            document.body.style.colorScheme = theme;
            document.body.style.backgroundColor = themeColor;
            if (isIOS) document.body.classList.add('is-ios');
          }
          document.addEventListener('DOMContentLoaded', function() {
            if (document.body) {
              document.body.setAttribute('data-theme', theme);
              document.body.style.colorScheme = theme;
              document.body.style.backgroundColor = themeColor;
              if (isIOS) document.body.classList.add('is-ios');
            }
          });
          if (window.Telegram && window.Telegram.WebApp) {
            try {
              var tgObj = window.Telegram.WebApp;
              if (typeof tgObj.setHeaderColor === 'function') tgObj.setHeaderColor(themeColor);
              if (typeof tgObj.setBackgroundColor === 'function') tgObj.setBackgroundColor(themeColor);
              if (typeof tgObj.setBottomBarColor === 'function') tgObj.setBottomBarColor(themeColor);
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <script>
      (function() {
        try {
          var t = document.documentElement.getAttribute('data-theme') || 'dark';
          if (document.body) {
            document.body.setAttribute('data-theme', t);
            document.body.style.colorScheme = t;
            document.body.style.backgroundColor = t === 'light' ? '#f4f4f6' : '#0d0d0d';
          }
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
