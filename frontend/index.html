<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" id="meta-theme-color-dark" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" id="meta-theme-color-light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TaskerBot — Трекер задач и целей</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('tasker_theme_mode') || 'auto';
          var theme = 'dark';
          if (mode === 'light') {
            theme = 'light';
          } else if (mode === 'dark') {
            theme = 'dark';
          } else {
            var sched = localStorage.getItem('tasker_theme_schedule_enabled') === 'true';
            if (sched) {
              var start = localStorage.getItem('tasker_theme_schedule_start') || '07:00';
              var end = localStorage.getItem('tasker_theme_schedule_end') || '20:00';
              var d = new Date();
              var h = String(d.getHours()).padStart(2, '0');
              var m = String(d.getMinutes()).padStart(2, '0');
              var cur = h + ':' + m;
              var isDay = start <= end ? (cur >= start && cur < end) : (cur >= start || cur < end);
            } else {
              var tg = window.Telegram && window.Telegram.WebApp;
              var isTg = tg && ((tg.initData && tg.initData.length > 0) || (tg.initDataUnsafe && tg.initDataUnsafe.user) || (tg.platform && tg.platform !== 'unknown') || (window.location.hash && window.location.hash.indexOf('tgWebAppData') !== -1));
              if (isTg && tg.colorScheme) {
                theme = tg.colorScheme === 'light' ? 'light' : 'dark';
              } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
              } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                theme = 'light';
              }
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
